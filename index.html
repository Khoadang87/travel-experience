<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="description" content="Walk of Fame Globe is a preview of walks and places you can explore on a globe, then walk through as a street clip.">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Walk of Fame Globe — preview</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
</head>
<body data-page="map">
  <a class="skip-link" href="#map-controls">Skip to map controls</a>
  <header class="top">
    <a class="brand" href="index.html">
      <strong>Walk of Fame Globe</strong>
      <span class="badge">Preview</span>
    </a>
    <button type="button" class="menu-btn" id="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">Menu</button>
    <div class="nav-backdrop" id="nav-backdrop" hidden></div>
    <nav id="site-nav" aria-label="Primary">
      <a href="index.html" aria-current="page">Map</a>
      <a class="nav-extra" href="index.html#places" data-open-places>Places</a>
      <a href="sales.html">For businesses</a>
      <a href="creator.html">Submit</a>
      <button type="button" class="nav-extra nav-credits" data-open-credits>Credits</button>
    </nav>
  </header>
  <div id="map" role="application" aria-label="Interactive globe and Los Angeles street map"></div>
  <div class="hud" id="map-controls" role="region" aria-label="Map controls">
    <div id="adbar" hidden></div>
    <div class="sr-only" aria-live="polite">
      <span id="mode-badge">Globe</span>
      <span id="map-status">Loading map…</span>
    </div>
    <div class="dock">
      <p class="dock-lead">Explore places on the globe, then hold Move to walk through a street clip.</p>
      <div class="dock-actions">
        <button type="button" class="primary" id="btn-wof">Start at The Grove</button>
        <button type="button" class="ghost" id="btn-all-pins">See all places</button>
        <button type="button" class="ghost" id="btn-globe" hidden>Back to globe</button>
      </div>
    </div>
  </div>
  <div id="places-panel" class="places-panel" hidden role="dialog" aria-modal="true" aria-labelledby="places-title">
    <div class="places-sheet">
      <div class="places-top">
        <h2 id="places-title">Places</h2>
        <button type="button" class="icon-btn" id="places-close" aria-label="Close">Close</button>
      </div>
      <div class="place-grid" id="place-grid"></div>
    </div>
  </div>
  <div id="credits-dialog" class="credits-shell" hidden>
    <div class="credits-panel" role="dialog" aria-modal="true" aria-labelledby="credits-title">
      <div class="places-top">
        <h2 id="credits-title">Credits</h2>
        <button type="button" class="icon-btn" data-credits-close aria-label="Close">Close</button>
      </div>
      <div class="credits-body" id="credits-body"></div>
    </div>
  </div>
  <aside id="pin-card" class="card" hidden>
    <div class="pin-card-top">
      <h2 id="pin-name"></h2>
      <button type="button" class="icon-btn" id="pin-card-close" aria-label="Close">Close</button>
    </div>
    <p id="pin-blurb" class="muted"></p>
    <p><a id="pin-source" href="#" target="_blank" rel="noopener"></a></p>
  </aside>
  <footer class="site-footer">
    <button type="button" class="text-link" id="btn-credits">Credits</button>
    <a href="admin.html">Admin</a>
  </footer>
  <div id="player-root"></div>
  <div id="splat-root"></div>
  <div id="videowalk-root"></div>
  <script type="importmap">
  {
    "imports": {
      "maplibre-gl": "./vendor/maplibre-gl.mjs",
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/three/addons/",
      "@sparkjsdev/spark": "./vendor/spark.module.js"
    }
  }
  </script>
  <script type="module" src="src/site-chrome.js"></script>
  <script type="module" src="src/map-app.js"></script>
</body>
</html>
