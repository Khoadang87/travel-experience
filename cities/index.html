<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Travel walks · cities</title><link rel="icon" href="data:,">
<style>
body{margin:0;min-height:100vh;background:#0d0d0f;color:#eee;font:15px/1.5 system-ui,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 28px) 20px 40px}
main{max-width:560px;margin:auto}h1{font-size:24px;margin:0 0 4px}.sub{color:#999;margin:0 0 22px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
li>a,li>div{display:block;padding:14px 16px;border-radius:12px;border:1px solid #ffffff1f;background:#ffffff0a;color:inherit;text-decoration:none}
li>a:hover{border-color:#ffffff55}.n{font-weight:600;font-size:17px}.c{color:#999;font-size:13px}.b{color:#ccc;font-size:13px;margin-top:4px}
.soon{opacity:.5}.tag{float:right;font-size:11px;color:#aaa;border:1px solid #fff3;border-radius:10px;padding:1px 8px;margin-top:3px}
</style></head><body><main>
<h1>Choose a city</h1><p class="sub">Real 360° street walks. Walk with the stick, drag to look around.</p>
<ul id="list"><li><div class="c">Loading…</div></li></ul>
</main><script>
fetch('cities.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>{const L=document.getElementById('list');L.innerHTML='';
for(const c of j.cities){const li=document.createElement('li'),live=c.status==='live'&&c.path,el=document.createElement(live?'a':'div');if(live)el.href=c.path;else li.className='soon';
const n=document.createElement('div');n.className='n';n.textContent=c.name;if(!live){const t=document.createElement('span');t.className='tag';t.textContent='Coming soon';n.appendChild(t);}
const k=document.createElement('div');k.className='c';k.textContent=c.country||'';el.append(n,k);if(c.blurb){const b=document.createElement('div');b.className='b';b.textContent=c.blurb;el.appendChild(b);}li.appendChild(el);L.appendChild(li);}})
.catch(()=>{document.getElementById('list').innerHTML='<li><a href="hoian/"><span class="n">Hội An</span></a></li>';});
</script></body></html>
