<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hội An – Japanese Bridge 3D scan (test v1)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;font:14px system-ui;color:#fff}
#c{position:fixed;inset:0}#joy{position:fixed;left:24px;bottom:34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4)}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.6)}
#info{position:fixed;top:8px;left:8px;right:8px;text-shadow:0 1px 2px #000}#ver{position:fixed;right:8px;bottom:8px;opacity:.6}</style></head><body>
<div id="c"></div><div id="info">Loading 3D scan…</div><div id="joy"><div id="knob"></div></div><div id="ver">scan-bridge-v1</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","@mkkellogg/gaussian-splats-3d":"https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"}}</script>
<script type="module">
import * as THREE from 'three';import * as GS from '@mkkellogg/gaussian-splats-3d';
const meta=await (await fetch('scan-bridge-v1.json?'+Date.now())).json();
const info=document.getElementById('info');
const r=new THREE.WebGLRenderer({antialias:false});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);
document.getElementById('c').appendChild(r.domElement);
const scene=new THREE.Scene();const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.05,500);
const v=new GS.DropInViewer({gpuAcceleratedSort:false,sharedMemoryForWorkers:false,integerBasedSort:false});
scene.add(v);
const P=meta.path.map(p=>new THREE.Vector3(...p));
let pos=P[meta.start||0].clone(),yaw=meta.yaw0||0,pitch=0;const EYE=0;
v.addSplatScene(meta.splat,{splatAlphaRemovalThreshold:5,showLoadingUI:false,progressiveLoad:true,onProgress:(p)=>info.textContent='Loading 3D scan… '+Math.round(p)+'%'})
 .then(()=>info.textContent='Drag to look · joystick to walk · you can roam the scanned area');
function clampToArea(p){let best=null,bd=1e9;for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1],ab=b.clone().sub(a),t=Math.max(0,Math.min(1,p.clone().sub(a).dot(ab)/ab.lengthSq())),q=a.clone().addScaledVector(ab,t),d=q.distanceTo(p);if(d<bd){bd=d;best=q}}
 const R=meta.radius||2;if(bd>R)p.copy(best.addScaledVector(p.clone().sub(best).normalize(),R));p.y=Math.max(best.y-0.3,Math.min(best.y+0.3,p.y));}
let jx=0,jy=0,jid=null;const joy=document.getElementById('joy'),knob=document.getElementById('knob');
function jset(e){const b=joy.getBoundingClientRect();let x=e.clientX-b.left-60,y=e.clientY-b.top-60;const l=Math.hypot(x,y);if(l>45){x*=45/l;y*=45/l}knob.style.transform=`translate(${x}px,${y}px)`;jx=x/45;jy=y/45}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jset(e);e.stopPropagation()});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jset(e)});
const jend=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;knob.style.transform=''}};joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
let lid=null,lx=0,ly=0;r.domElement.addEventListener('pointerdown',e=>{lid=e.pointerId;lx=e.clientX;ly=e.clientY});
addEventListener('pointermove',e=>{if(e.pointerId!==lid)return;yaw+=(e.clientX-lx)*0.005;pitch=Math.max(-1.3,Math.min(1.3,pitch+(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY});
addEventListener('pointerup',e=>{if(e.pointerId===lid)lid=null});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
const qs=new URLSearchParams(location.search);if(qs.has('p')){const a=qs.get('p').split(',').map(Number);pos.set(a[0],a[1],a[2]);yaw=a[3]||0;pitch=a[4]||0}
let last=performance.now();
r.setAnimationLoop(()=>{const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;const sp=(meta.speed||1.2)*dt;
 const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),s=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 pos.addScaledVector(f,-jy*sp).addScaledVector(s,jx*sp);if(!qs.has('free'))clampToArea(pos);
 cam.position.copy(pos);cam.rotation.set(0,0,0);cam.rotation.order='YXZ';cam.rotation.y=yaw;cam.rotation.x=-pitch;
 r.render(scene,cam);window.__state={pos:pos.toArray(),yaw,pitch}});
</script></body></html>
