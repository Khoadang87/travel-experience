<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Hội An media decode diagnostic w58</title><style>body{margin:24px;background:#152024;color:#faf6eb;font:16px/1.5 system-ui}main{max-width:1000px;margin:auto}video{width:100%;aspect-ratio:2;background:#080c0d}button{min-height:44px;margin:8px 8px 8px 0;padding:8px 16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 monospace}p{max-width:75ch}</style><main><h1>Internal media decode check · w58</h1><p>This is a raw filmed 360° panorama shown in a normal video element for codec, seeking and cross-origin checks. It is not the virtual-walk player, a scenery replacement, a movement test or an approved preview.</p><video id="media" controls playsinline crossorigin="anonymous" preload="metadata" muted src="https://raw.githubusercontent.com/Khoadang87/travel-experience/fb7f1952b2cbe6deeb1531ccc6a1b02260828e93/cities/hoian/test/assets/henk-return-w54.mp4"></video><div><button id="play">Play filmed video</button><button id="pause">Pause filmed video</button><button id="seek5">Seek to local 5 seconds</button><button id="seek20">Seek to local 20 seconds</button><button id="pixels">Check decoded pixel access</button></div><pre id="report" role="status" aria-live="polite"></pre></main><script>
const video=document.getElementById('media'),report=document.getElementById('report');
let lastEvent='initial',pixelCheck=null,playError=null;
function update(){report.textContent=JSON.stringify({diagnostic:'w58-media-only',assetSha256:'e802da59e406706acd71e03a8319b104a67a147698f5da7eb0a1215a5ac47cda',event:lastEvent,time:video.currentTime,duration:Number.isFinite(video.duration)?video.duration:null,readyState:video.readyState,networkState:video.networkState,width:video.videoWidth,height:video.videoHeight,paused:video.paused,seeking:video.seeking,error:video.error?{code:video.error.code,message:video.error.message}:null,playError,pixelCheck,playerMovementApproved:false,iphoneAccepted:false},null,2)}
for(const type of ['loadedmetadata','loadeddata','canplay','play','playing','pause','seeking','seeked','stalled','waiting','error','ended'])video.addEventListener(type,()=>{lastEvent=type;update()});
document.getElementById('play').onclick=async()=>{playError=null;try{await video.play()}catch(error){playError=error.message}update()};
document.getElementById('pause').onclick=()=>{video.pause();update()};
document.getElementById('seek5').onclick=()=>{video.pause();video.currentTime=5;update()};
document.getElementById('seek20').onclick=()=>{video.pause();video.currentTime=20;update()};
document.getElementById('pixels').onclick=()=>{try{if(video.readyState<2)throw Error('No decoded frame yet');const c=document.createElement('canvas');c.width=32;c.height=16;const ctx=c.getContext('2d');ctx.drawImage(video,0,0,32,16);const d=ctx.getImageData(0,0,32,16).data;let sum=0;for(let i=0;i<d.length;i+=4)sum+=d[i]+d[i+1]+d[i+2];pixelCheck={readable:true,meanRGB:sum/(32*16*3),time:video.currentTime}}catch(error){pixelCheck={readable:false,error:error.message}}update()};
setInterval(update,500);update();
</script></html>
