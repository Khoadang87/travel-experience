<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hội An w69 media scheduling diagnostic</title>
<style>body{font:16px system-ui;background:#162120;color:#fff;margin:24px}button,select{font:inherit;padding:12px;margin:6px}video{display:block;width:min(720px,90vw);height:auto}video.obscured{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1}pre{white-space:pre-wrap}canvas{width:320px;height:160px}button:disabled{opacity:.4}</style>
<h1>Media scheduling diagnostic · w69</h1><p>Internal comparison using the exact real return clip. Raw panorama only: this is not a virtual walk or a replacement scene.</p>
<label>Video presentation <select id="mode"><option value="visible">Visible native video</option><option value="obscured">Obscured player-style video</option></select></label>
<label>Playback rate <select id="rate"><option value="1">1.00</option><option value="0.9497041420118342">0.95</option></select></label>
<button id="reset" disabled>Reset to 5 seconds</button><button id="hold" disabled>Hold to play; release to pause</button>
<video id="source" muted playsinline crossorigin="anonymous" preload="auto"></video><canvas id="sample" width="320" height="160" aria-label="Decoded panorama sample"></canvas><p id="status">Loading real clip…</p><pre id="result"></pre>
<script>
const video=document.querySelector('video'),mode=document.querySelector('#mode'),rate=document.querySelector('#rate'),hold=document.querySelector('#hold'),reset=document.querySelector('#reset'),result=document.querySelector('#result'),status=document.querySelector('#status'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
let sequence=0,active=null,rows=[],frameId,resetting=false;
function snap(kind,extra={}){const q=video.getVideoPlaybackQuality?.();const d={kind,sequence,ms:active?performance.now()-active.started:null,time:video.currentTime,paused:video.paused,ready:video.readyState,rate:video.playbackRate,mode:mode.value,visibility:document.visibilityState,focused:document.hasFocus(),frames:q?.totalVideoFrames,dropped:q?.droppedVideoFrames,...extra};rows.push(d);if(rows.length>120)rows.shift();console.info('Hoian scheduling w69',JSON.stringify(d));result.textContent=JSON.stringify(rows.slice(-12),null,2);}
function sample(){if(video.readyState<2)return;ctx.drawImage(video,0,0,320,160);}
for(const event of ['playing','pause','waiting','stalled','seeked','ratechange'])video.addEventListener(event,()=>{snap(event);sample();});
if(video.requestVideoFrameCallback){const cb=(now,m)=>{snap('decoded-frame-callback',{mediaTime:m.mediaTime,presentedFrames:m.presentedFrames});sample();frameId=video.requestVideoFrameCallback(cb)};frameId=video.requestVideoFrameCallback(cb);}
async function resetPoint(){resetting=true;hold.disabled=true;video.pause();active=null;video.currentTime=5;const started=performance.now();while(video.seeking||video.readyState<2){if(performance.now()-started>10000)throw Error('Reset did not settle');await new Promise(r=>setTimeout(r,40));}sample();resetting=false;hold.disabled=false;status.textContent='Paused at '+video.currentTime.toFixed(3)+' seconds';snap('reset-settled');}
mode.onchange=()=>{video.pause();video.className=mode.value==='obscured'?'obscured':'';snap('presentation-change');};rate.onchange=()=>{video.playbackRate=Number(rate.value);snap('rate-selected');};reset.onclick=()=>resetPoint().catch(e=>status.textContent=e.message);
hold.onpointerdown=e=>{if(resetting||active?.held)return;e.preventDefault();hold.setPointerCapture(e.pointerId);sequence++;active={started:performance.now(),held:true};snap('press');video.play().then(()=>{snap('play-resolved');if(!active.held)video.pause();}).catch(e=>snap('play-error',{error:e.name}));};
function release(){if(!active?.held)return;active.held=false;snap('release');video.pause();sample();status.textContent='Paused at '+video.currentTime.toFixed(6)+' seconds';setTimeout(()=>snap('settled-after-release'),150);}
hold.onpointerup=release;hold.onpointercancel=release;hold.onlostpointercapture=release;addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden)release();});
video.onerror=()=>status.textContent='Media error '+video.error?.code;
video.onloadeddata=()=>{reset.disabled=false;resetPoint().catch(e=>status.textContent=e.message);};
video.src='https://raw.githubusercontent.com/Khoadang87/travel-experience/fb7f1952b2cbe6deeb1531ccc6a1b02260828e93/cities/hoian/test/assets/henk-return-w54.mp4';
</script></html>
