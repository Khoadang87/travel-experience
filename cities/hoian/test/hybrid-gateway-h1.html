<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hội An – red gateway (walkable test h1)</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;z-index:20;gap:14px;padding:24px;text-align:center}
#load h1{font-size:20px;margin:0;font-weight:600}
#bar{width:min(320px,80vw);height:8px;border-radius:4px;background:#333;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#e0443e;transition:width .2s}
#ltxt{font-size:14px;opacity:.8}
#go{display:none;min-height:44px;padding:0 26px;border-radius:22px;border:0;background:#e0443e;color:#fff;font-size:17px;font-weight:600}
#joy{position:fixed;left:calc(24px + env(safe-area-inset-left));bottom:calc(28px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);z-index:5}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.7)}
#hint{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);padding:8px 14px;border-radius:16px;font-size:13px;z-index:5;transition:opacity .6s;white-space:nowrap}
#edge{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(10,10,10,.85) 100%)}
#edgemsg{position:fixed;bottom:calc(170px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:8px 14px;border-radius:16px;font-size:13px;opacity:0;transition:opacity .3s;z-index:5;pointer-events:none}
#dbg{position:fixed;right:6px;bottom:6px;font:11px monospace;background:rgba(0,0,0,.5);padding:4px;z-index:6;display:none}
</style>
<script type="importmap">{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
 "@sparkjsdev/spark":"https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.js"}}</script>
</head><body>
<div id="load"><h1>Hội An · Red gateway</h1><div id="bar"><i></i></div><div id="ltxt">Loading 3D scene…</div><button id="go">Start walking</button></div>
<div id="joy"><div id="knob"></div></div>
<div id="hint">Joystick to walk · drag to look around</div>
<div id="edge"></div><div id="edgemsg">This is as far as the scene goes</div>
<div id="dbg"></div>
<script type="module" src="./hybrid-gateway-h1.js"></script>
</body></html>
