<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hội An 360° walk</title>
<link rel="icon" href="data:,">
<link rel="preload" as="image" href="assets/walk/start.jpg"><link rel="preload" as="image" href="assets/walk/poster.jpg">

</head><body class="loading">
<div id="app"></div>
<div id="badge"></div>
<div id="loader"><div id="loadmsg">Starting…</div><div id="bar"><div id="fill"></div></div><div id="loaddetail"></div></div>
<div id="error" hidden></div>
<div id="live"></div><div id="spin" role="status" aria-label="Buffering the walk" hidden></div>
<button id="tapstart" hidden>▶ Tap to start the walk</button>
<div id="streetbar" hidden><div id="strack"><div id="sfill"></div></div><div id="slabel"></div><div id="nodestatus"></div></div>
<div id="joy"><div id="knob"></div></div>
<div id="buttons"><button id="turnL" aria-label="Turn around">⟲ Turn</button><button id="turnR" aria-label="Turn right">Turn ⟳</button><button id="reset">Reset</button><button id="scene"></button></div>
<button id="quality" type="button" aria-label="Video quality: cycle Auto, High, Data saver" disabled>Auto · loading</button>
<button id="explore-toggle" type="button" aria-controls="explore" aria-expanded="false">Explore</button>
<nav id="junctions" aria-label="Available turns" hidden></nav>
<div id="navigation-note" role="status" hidden></div>
<div id="explore-shade" hidden></div>
<section id="explore" role="dialog" aria-modal="true" aria-labelledby="explore-title" hidden>
  <header><h1 id="explore-title">Explore Hội An</h1><button id="explore-close" type="button" aria-label="Close Explore">Close</button></header>
  <h2 id="route-name"></h2><p id="route-description"></p>
  <label for="route-position">Choose a point on this walk</label><input id="route-position" type="range" step="1"><output id="route-time" for="route-position"></output>
  <button id="route-go" type="button">Go here</button><p id="explore-message" role="status"></p>
  <h2>Available walks</h2><nav id="route-list" aria-label="Available walks"></nav>
  <h2>Connected streets & entrances</h2><nav id="route-connections" aria-label="Connected streets and entrances"></nav>
  <p id="no-connections">This walk has no connected routes yet. New streets and building or temple interiors need additional recorded footage.</p>
</section>
<div id="hint">Drag to look · WASD / arrows to move (desktop) · joystick to move (phone)</div>
<script src="vendor/hls.min.js"></script>
<script type="module" src="walk.js?v=w12"></script>
<script type="module" src="explore.js?v=w12"></script>

</body></html>
