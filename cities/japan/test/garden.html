<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sakura Lantern Garden · walk-around world (prototype)</title>
<style>
:root{--xg:rgba(22,18,14,.42);--xl:rgba(255,255,255,.18);--acc:#f2a7b8;--mut:rgba(251,246,238,.62);
--sa-t:env(safe-area-inset-top,0px);--sa-b:env(safe-area-inset-bottom,0px);--sa-l:env(safe-area-inset-left,0px);--sa-r:env(safe-area-inset-right,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1410;color:#fbf6ee;font-family:system-ui,-apple-system,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
.glass{background:var(--xg);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:.5px solid var(--xl);box-shadow:0 8px 30px rgba(0,0,0,.25)}
#title{position:fixed;z-index:5;top:calc(var(--sa-t) + 10px);left:calc(var(--sa-l) + 12px);border-radius:16px;padding:7px 14px;transition:opacity .5s}
#title small{display:block;font:600 10px/1.2 system-ui;letter-spacing:.12em;color:var(--mut)}
#title b{font:600 15px/1.25 system-ui}
#tip{position:fixed;z-index:5;left:50%;bottom:calc(var(--sa-b) + 180px);transform:translateX(-50%);border-radius:999px;padding:8px 16px;font:500 13px system-ui;white-space:nowrap;transition:opacity .8s}
#joy{position:fixed;z-index:6;right:calc(var(--sa-r) + 18px);bottom:calc(var(--sa-b) + 36px);width:124px;height:124px;border-radius:50%;touch-action:none}
#joy::after{content:"WALK";position:absolute;left:0;right:0;top:20px;text-align:center;font:600 10px system-ui;letter-spacing:.1em;color:var(--mut);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(251,246,238,.85);box-shadow:0 2px 10px rgba(0,0,0,.35);pointer-events:none}
#load{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#1a1410;font:600 14px system-ui;color:var(--mut);transition:opacity .6s}
body.walking #title{opacity:.15}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="load">Opening the garden gate…</div>
<div id="title" class="glass"><small>JAPAN · WALK-AROUND TEST</small><b>Sakura Lantern Garden</b></div>
<div id="tip" class="glass">Drag to look · stick to walk anywhere</div>
<div id="joy" class="glass"><div id="knob"></div></div>
<script type="module" src="garden/garden.js?v=g1b"></script>
</body></html>
